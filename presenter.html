<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KJV Live Presenter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; background:#000; color:#fff; font-family: Arial, sans-serif; }
    .wrap { padding: 42px; }
    .ref { font-size: 44px; font-weight: 800; margin-bottom: 18px; }
    .text { font-size: 54px; font-weight: 800; line-height: 1.25; }
    .meta { margin-top: 18px; font-size: 16px; opacity: 0.65; }
    .status { position: fixed; bottom: 10px; right: 12px; font-size: 14px; opacity: 0.55; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ref" id="ref">Waiting for verse…</div>
    <div class="text" id="text"></div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="status" id="status">Disconnected</div>

<script>
  // Session name: keep it simple for now
  const sessionId = "demo";

  // Connect to server WebSocket
  const wsUrl = ((location.protocol === "https:") ? "wss://" : "ws://") + location.host + "/ws/" + sessionId;

  const elRef = document.getElementById("ref");
  const elText = document.getElementById("text");
  const elMeta = document.getElementById("meta");
  const elStatus = document.getElementById("status");

  function render(payload) {
    if (!payload || payload.type !== "display") return;

    elRef.textContent = payload.reference || "—";
    elText.textContent = payload.text_kjv || payload.text || "";
    elMeta.textContent = `Mode: ${payload.mode || ""} | Confidence: ${payload.confidence ?? ""}`;
  }

  const ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    elStatus.textContent = "Connected";
    // keepalive ping
    setInterval(() => { try { ws.send("ping"); } catch(e) {} }, 5000);
  };

  ws.onmessage = (ev) => {
    try { render(JSON.parse(ev.data)); } catch(e) {}
  };

  ws.onclose = () => { elStatus.textContent = "Disconnected"; };
</script>
</body>
</html>
